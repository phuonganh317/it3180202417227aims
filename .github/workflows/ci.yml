name: Python tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
